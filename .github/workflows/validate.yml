# Validate-only CI for the NAVE static site.
#
# Runs the same checks as `npm test` on a developer machine: the static layer
# (`npm run validate`) followed by the Playwright e2e projects. It only reads
# the repository: no publishing, no credentials, no repository-settings changes.
#
# Legal-placeholder guard (ST-PLH): runs inside `npm test` in WARN mode. It
# prints a `::warning::` annotation for every live placeholder and does not fail
# the job. The single switch that makes it blocking is the PLACEHOLDER_GUARD
# environment variable below: set it to `block` once the owner has supplied the
# legal data.
#
# Visual regression (`npm run test:visual`) is local-only and is not run here.
#
# Every `uses:` is pinned to a full 40-character commit SHA. When bumping a pin,
# update both the SHA and the `# vX.Y.Z` comment.

name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow token can only read repository contents.
permissions:
  contents: read

# One run per ref; a newer push to the same branch or PR cancels the older run.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ST-PLH switch: `warn` reports placeholders without failing; `block` fails the job.
      PLACEHOLDER_GUARD: warn
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact version the test suite was developed on; package.json engines is >=24.8.0.
          node-version: '24.21.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Resolves to the locally installed @playwright/test (pinned by package-lock.json);
      # --no-install forbids npx from fetching a different version.
      - name: Install Playwright Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Run tests (static layer, then e2e)
        run: npm test
        env:
          # Public ubuntu-24.04 has 4 vCPU; SwiftShader is CPU-heavy, so serialize 3D tests (local default stays 2).
          PW_WORKERS: 1
        timeout-minutes: 20

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
